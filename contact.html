  <noscript><style>.loader { display: none; } .cform__grid { opacity: 1 !important; }</style></noscript>
  <script>
    /* Decide before anything paints: the loader is only for arriving at the
       site, never for moving around inside it. A navigation that came from our
       own origin is a click on our own nav; anything else - a pasted link, a
       bookmark, a search result, a typed URL - is an arrival. */
    (function () {
      var from = document.referrer;
      var internal = false;
      try {
        internal = !!from && new URL(from).origin === location.origin;
      } catch (e) {}

      /* A refresh counts as arriving too. Reloading keeps whatever referrer the
         page was opened with, so a page reached from our own nav and then
         refreshed still looks internal - the navigation type is the only thing
         that tells them apart. */
      var reloaded = false;
      try {
        var nav = performance.getEntriesByType("navigation")[0];
        reloaded = nav
          ? nav.type === "reload"
          : !!(performance.navigation && performance.navigation.type === 1);
      } catch (e) {}

      // Consume the clicked destination once; this also works without a referrer.
      try {
        var key = "lilvdvm:internal-navigation";
        var pending = JSON.parse(sessionStorage.getItem(key) || "null");
        sessionStorage.removeItem(key);
        if (pending && pending.destination === location.pathname + location.search &&
            Date.now() - pending.time >= 0 && Date.now() - pending.time < 15000) internal = true;
      } catch (e) {}

      if (!internal || reloaded) document.documentElement.classList.add("has-loader");
      /* Arrived by the slide from another page: this page's opening frame has
         already come up on the way in. If the page left had its links somewhere
         else, they fade in here rather than appear. A reload is an arrival of
         its own. */
      try {
        var slide = JSON.parse(sessionStorage.getItem("lilvdvm:arrive") || "null");
        sessionStorage.removeItem("lilvdvm:arrive");
        if (slide && slide.how === "slide" && !reloaded &&
            Date.now() - slide.time >= 0 && Date.now() - slide.time < 15000) {
          document.documentElement.classList.add("arrive-slide");
          if (slide.mid !== true) document.documentElement.classList.add("arrive-nav-fade");
          if (slide.blur) document.documentElement.classList.add("arrive-blur");
        }
      } catch (e) {}

      /* Set here rather than in the stylesheet so the white is painted with the
         very first frame - a page that starts black and turns white would
         flash, and the header inverts against whatever is behind it. */
    })();
  </script>

<body>
  <div class="loader" aria-hidden="true">
    <div class="loader__curtain loader__curtain--top"></div>
    <div class="loader__band">
      <div class="loader__fill"></div>
      <span class="loader__label">Loading ...</span>
    </div>
    <div class="loader__curtain loader__curtain--bottom"></div>
  </div>

  <!-- Three bands: the invitation and the direct ways in above, the form
       below, and the row of links in the clear band between them. -->
  <main class="page contact">
    <header class="contact__top">
      <h1 class="contact__title">
        <span>Let&rsquo;s create</span>
        <span>something together</span>
      </h1>

      <ul class="contact__ways">
        <li><a class="contact__mail" href="mailto:adamboulghal1@gmail.com">adamboulghal1@gmail.com</a></li>
        <li>
          <a href="https://www.instagram.com/lilvdvm/" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <rect x="2.75" y="2.75" width="18.5" height="18.5" rx="5.25"/>
              <circle cx="12" cy="12" r="4.25"/>
              <circle cx="17.4" cy="6.6" r="1.15" fill="currentColor" stroke="none"/>
            </svg>
            Instagram
          </a>
        </li>
        <li>
          <!-- wa.me wants the number in international form with no plus,
               spaces or dashes, so +212 659-915053 becomes 212659915053. -->
          <a href="https://wa.me/212659915053" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3.4 20.6l1.3-4a8.4 8.4 0 1 1 3.1 3.1l-4.4.9z"/>
              <path d="M9.1 8.4h1.2l.9 2.2-1 .9a6 6 0 0 0 2.9 2.9l.9-1 2.2.9v1.2c0 .5-.4.9-.9.9A7.9 7.9 0 0 1 8.2 9.3c0-.5.4-.9.9-.9z"/>
            </svg>
            WhatsApp
          </a>
        </li>
      </ul>
    </header>

    <!-- Sent through Web3Forms, which emails each message to
         adamboulghal1@gmail.com. The access key is meant to be public: it can
         only deliver to that inbox. The visitor's email is the reply-to, so
         answering the email answers them. -->
    <form class="cform" data-endpoint="https://api.web3forms.com/submit" novalidate>
      <input type="hidden" name="access_key" value="50988384-020c-4d52-8c1d-7217c4aa9c88">
      <input type="hidden" name="subject" value="New message from lilvdvm.com">
      <input type="hidden" name="from_name" value="lilvdvm.com contact form">
      <!-- A trap for bots: people never see it, so anything ticked here is
           thrown away by Web3Forms rather than delivered. -->
      <input type="checkbox" name="botcheck" class="cform__trap" tabindex="-1" autocomplete="off" aria-hidden="true">
      <!-- Each field carries the words to say when it is empty, and the email
           field what to say when it is malformed; the script writes them into
           the line under the field, which the field points to for screen
           readers. -->
      <div class="cform__item" data-item>
        <label class="cform__label" for="cf-name">Your name</label>
        <input class="cform__input" id="cf-name" name="name" type="text" placeholder="John Doe" autocomplete="name" maxlength="100" required
               aria-describedby="cf-name-error" data-missing="Please enter your name">
        <p class="cform__error" id="cf-name-error" data-error></p>
      </div>
      <div class="cform__item" data-item>
        <label class="cform__label" for="cf-email">Your email</label>
        <input class="cform__input" id="cf-email" name="email" type="email" placeholder="hello@john.com" autocomplete="email" maxlength="150" required
               aria-describedby="cf-email-error" data-missing="Please enter your email" data-malformed="That email doesn&rsquo;t look right">
        <p class="cform__error" id="cf-email-error" data-error></p>
      </div>
      <div class="cform__item cform__item--area" data-item>
        <label class="cform__label" for="cf-project">Your message</label>
        <textarea class="cform__input cform__input--area" id="cf-project" name="message" placeholder="Hi, I&rsquo;d like to work with you on a video project..." rows="3" maxlength="5000" required
                  aria-describedby="cf-project-error" data-missing="Please write a message"></textarea>
        <p class="cform__error" id="cf-project-error" data-error></p>
      </div>
      <div class="cform__foot">
        <p class="cform__note" data-note role="status" aria-live="polite"></p>
        <button class="cform__submit" type="submit" data-cursor="none">
          <span class="cform__spinner" aria-hidden="true"></span>
          <span class="cform__submit-label" data-submit-label>Send</span>
        </button>
      </div>
    </form>
  </main>
